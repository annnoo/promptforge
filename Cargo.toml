[workspace]
members = [
    "crates/prompt-core",
    "crates/prompt-application",
    "crates/prompt-persistence",
    "crates/prompt-refinement",
    "crates/prompt-tui",
    "crates/prompt-gui",
    "crates/prompt-cli",
]
default-members = ["crates/prompt-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PromptForge Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
prompt-core = { path = "crates/prompt-core" }
prompt-application = { path = "crates/prompt-application" }
prompt-persistence = { path = "crates/prompt-persistence" }
prompt-refinement = { path = "crates/prompt-refinement" }
prompt-tui = { path = "crates/prompt-tui" }
prompt-gui = { path = "crates/prompt-gui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
ratatui = "0.30"
crossterm = "0.29"
eframe = "0.36"
directories = "6.0"
similar = "3.2"
arboard = "3.6"
tempfile = "3.17"
