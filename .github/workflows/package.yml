name: Build and Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Test & Lint Suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Check and build frontend
        run: pnpm --dir ui run build

      - name: Run workspace tests
        run: cargo test --workspace

  package-desktop:
    name: Package ${{ matrix.platform_name }}
    needs: [lint-and-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_name: 'Linux (AppImage)'
            bundle_args: '--bundles appimage'
            artifact_name: 'PromptForge-Linux-x86_64-AppImage'
            artifact_pattern: 'target/release/bundle/appimage/*.AppImage'

          - os: windows-latest
            platform_name: 'Windows (x64 NSIS)'
            bundle_args: '--bundles nsis'
            artifact_name: 'PromptForge-Windows-x64-Setup'
            artifact_pattern: 'target/release/bundle/nsis/*.exe'

          - os: macos-latest
            platform_name: 'macOS (Apple Silicon)'
            bundle_args: '--bundles dmg'
            artifact_name: 'PromptForge-macOS-AppleSilicon-DMG'
            artifact_pattern: 'target/release/bundle/dmg/*.dmg'

          - os: macos-13
            platform_name: 'macOS (Intel)'
            bundle_args: '--bundles dmg'
            artifact_name: 'PromptForge-macOS-Intel-DMG'
            artifact_pattern: 'target/release/bundle/dmg/*.dmg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build frontend distribution
        run: pnpm --dir ui run build

      - name: Build and package Tauri desktop application
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build ${{ matrix.bundle_args }}

      - name: Upload packaged desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_pattern }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
